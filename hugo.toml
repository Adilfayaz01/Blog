baseURL = 'https://fayasuddin.blog/'
languageCode = 'en-us'
title = 'Mohammed Fayasuddin'
theme = "PaperMod"
description = "Cloud security guides, tutorials, and deep dives across AWS, Azure, and GCP by Mohammed Fayasuddin"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true



[params.profileMode]
enabled = true
title = "Mohammed Fayasuddin"
subtitle = "Cloud Security Engineer"
imageUrl = "https://cdn.pixabay.com/photo/2021/03/02/01/07/cyberpunk-6061251_960_720.jpg"
imageTitle = "Action"
imageWidth = 180
imageHeight = 180

  [[params.profileMode.buttons]]
  name = "Blog"
  url = "/posts"

  [[params.socialIcons]]
  name = "Youtube"
  url = "https://youtube.com/@fayasuddin"

  [[params.socialIcons]]
  name = "Github"
  url = "https://github.com/Adilfayaz01"

  [[params.socialIcons]]
  name = "Linkedin"
  url = "https://www.linkedin.com/in/mohammed-fayasuddin-a7035a23b/"

[params]
  env = "production"
  author = "Fayasuddin"
  DateFormat = "January 2, 2006"
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  hideFooter = true
  hideCopyright = true
  newPostDays = 14

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 100
    threshold = 0.3
    ignoreLocation = true
    minMatchCharLength = 2
    limit = 20
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 2

[cover]
  image = "https://cdn.pixabay.com/photo/2014/09/02/15/28/styggkarret-433688_960_720.jpg"
  alt = "Image"
  caption = "Image"
  relative = false
